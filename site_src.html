<title>makeielts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Take a real-format IELTS Reading or Listening test, get your band score, and see exactly which trap caught you on every wrong answer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,450;6..72,500&family=Geist:wght@400;450;500;600&family=Geist+Mono:wght@400;500&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: product-first editorial. White page, soft-grey tiles, serif headlines, black actions; colour only means something (green = correct, coral = trap, yellow = evidence). */
:root{
  --paper:#FFFFFF; --site:#F8F9FB; --surface:#FFFFFF; --surface-2:#F2F4F7; --tile:#F3F5F7;
  --ink:#0B0E13; --ink-2:#2A303A; --muted:#5B6370; --muted-2:#8D95A1; --line:#E3E6EB; --line-2:#EEF0F3;
  --mk:#DDF5E9; --glow:rgba(16,185,129,.12);
  --primary:#0B0E13; --primary-ink:#FFFFFF;
  --biro:#047857; --biro-ink:#FFFFFF; --biro-soft:#ECFDF5;
  --ok:#047857; --ok-soft:#ECFDF5; --trap:#DC3F45; --trap-soft:#FEF1F1; --hl:#FDF0B5; --warn:#B45309; --warn-soft:#FEF6E7;
  --ring:0 0 0 1px rgba(0,0,0,.06),0 1px 2px -1px rgba(0,0,0,.06),0 2px 4px 0 rgba(0,0,0,.04);
  --ring-hover:0 0 0 1px rgba(0,0,0,.09),0 1px 2px -1px rgba(0,0,0,.08),0 2px 4px 0 rgba(0,0,0,.06);
  --lift:0 0 0 1px rgba(0,0,0,.06),0 24px 60px -28px rgba(0,0,0,.28);
  --shadow:var(--ring);
  --f-display:"Newsreader","Iowan Old Style",Georgia,serif;
  --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0B0E13; --site:#0F131A; --surface:#141922; --surface-2:#1C222D; --tile:#121821;
  --ink:#F3F5F8; --ink-2:#D9DEE6; --muted:#B4BCC8; --muted-2:#7D8794; --line:#2A3240; --line-2:#202733;
  --primary:#F3F5F8; --primary-ink:#0B0E13;
  --biro:#4ADE9F; --biro-ink:#04261A; --biro-soft:#10291F;
  --ok:#4ADE9F; --ok-soft:#10291F; --trap:#FF7B80; --trap-soft:#331A1E; --hl:rgba(250,214,70,.26); --warn:#F7BE63; --warn-soft:#2E2412;
  --mk:rgba(74,222,159,.16); --glow:rgba(74,222,159,.16);
  --ring:0 0 0 1px rgba(255,255,255,.09),0 1px 2px -1px rgba(0,0,0,.5);
  --ring-hover:0 0 0 1px rgba(255,255,255,.16),0 1px 2px -1px rgba(0,0,0,.5);
  --lift:0 0 0 1px rgba(255,255,255,.1),0 30px 70px -30px rgba(0,0,0,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B0E13; --site:#0F131A; --surface:#141922; --surface-2:#1C222D; --tile:#121821;
  --ink:#F3F5F8; --ink-2:#D9DEE6; --muted:#B4BCC8; --muted-2:#7D8794; --line:#2A3240; --line-2:#202733;
  --primary:#F3F5F8; --primary-ink:#0B0E13;
  --biro:#4ADE9F; --biro-ink:#04261A; --biro-soft:#10291F;
  --ok:#4ADE9F; --ok-soft:#10291F; --trap:#FF7B80; --trap-soft:#331A1E; --hl:rgba(250,214,70,.26); --warn:#F7BE63; --warn-soft:#2E2412;
  --mk:rgba(74,222,159,.16); --glow:rgba(74,222,159,.16);
  --ring:0 0 0 1px rgba(255,255,255,.09),0 1px 2px -1px rgba(0,0,0,.5);
  --ring-hover:0 0 0 1px rgba(255,255,255,.16),0 1px 2px -1px rgba(0,0,0,.5);
  --lift:0 0 0 1px rgba(255,255,255,.1),0 30px 70px -30px rgba(0,0,0,.9); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1,h2{font-family:var(--f-display);font-weight:480;letter-spacing:-.025em;line-height:1.05}
h3,h4{font-family:var(--f-body);font-weight:600;letter-spacing:-.02em;line-height:1.3}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.serif{font-family:var(--f-display)}
.eyebrow{font-size:13px;font-weight:500;color:var(--muted)}
.hl{background:var(--hl);border-radius:3px;padding:0 .15em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.user-hl{background:var(--hl);color:inherit;border-radius:2px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.arrow{display:inline-block;transition:transform .15s}
a:hover .arrow,button:hover .arrow{transform:translateX(2px)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;border:0;font-weight:500;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,box-shadow .15s,transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{opacity:.88}
.btn-ghost{background:var(--surface);color:var(--ink);box-shadow:var(--ring)}
.btn-ghost:hover{box-shadow:var(--ring-hover);background:var(--site)}
.btn-quiet{background:transparent;color:var(--muted);height:auto;padding:6px 8px}
.btn-quiet:hover{color:var(--ink)}
.btn-lg{height:46px;padding:0 22px;font-size:15.5px;border-radius:12px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .kbd{font-family:var(--f-mono);font-size:12px;opacity:.6}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:60px}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;color:var(--ink);text-decoration:none;letter-spacing:-.03em}
.logo-mark{width:26px;height:26px;border-radius:7px;background:var(--ink);display:grid;place-items:center;color:var(--paper);font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1}
.logo b{font-weight:600;color:var(--muted)}
.nav{display:flex;gap:2px;margin-left:auto;align-items:center}
.nav a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:450;padding:7px 11px;border-radius:8px}
.nav a:hover,.nav a[aria-current="page"]{color:var(--ink)}
.nav a.btn-primary,.nav a.btn-primary:hover{color:var(--primary-ink);height:32px;padding:0 12px;font-size:13.5px;margin-left:10px;border-radius:8px}
@media (max-width:720px){.nav a.hide-sm{display:none}}

/* Sections */
section{padding-block:96px}
.sec-head{display:grid;gap:14px;max-width:660px;margin:0 auto 48px;text-align:center;justify-items:center}
.sec-head.left{margin-left:0;text-align:left;justify-items:start}
.sec-head h2{font-size:clamp(34px,5vw,50px)}
.sec-head p{color:var(--muted);font-size:17px;max-width:540px}
.site{background:var(--site);border-block:1px solid var(--line-2)}
@media (max-width:720px){section{padding-block:64px}}

/* Hero */
.hero{padding-block:72px 0;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:720px;background:radial-gradient(ellipse 55% 50% at 50% 0%,var(--glow),transparent 70%),radial-gradient(ellipse 35% 30% at 85% 55%,color-mix(in srgb,var(--glow) 60%,transparent),transparent 70%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:0 0 auto;height:560px;background-image:radial-gradient(color-mix(in srgb,var(--muted-2) 35%,transparent) 1px,transparent 1px);background-size:24px 24px;-webkit-mask-image:radial-gradient(ellipse 55% 60% at 50% 15%,#000 20%,transparent 70%);mask-image:radial-gradient(ellipse 55% 60% at 50% 15%,#000 20%,transparent 70%);pointer-events:none;opacity:.5}
.hero > .wrap{position:relative;z-index:1}
.hero-copy{position:relative;display:grid;justify-items:center;text-align:center;gap:22px;max-width:820px;margin:0 auto}
.pill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 6px;border-radius:999px;background:var(--surface);box-shadow:var(--ring);font-size:13px;color:var(--muted);text-decoration:none}
.pill b{background:var(--biro);color:var(--biro-ink);font-weight:600;font-size:12px;padding:2px 8px;border-radius:999px}
.hero h1{font-size:clamp(44px,7.4vw,80px);font-weight:500;letter-spacing:-.035em;line-height:1.02}
.hero h1 .mk{background:var(--mk);border-radius:12px;padding:0 .14em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero .lede{font-size:18.5px;line-height:1.7;color:var(--muted);max-width:560px}
.hero-ctas{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.micro{display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:13.5px}
.micro span{display:inline-flex;gap:6px;align-items:center}
.micro svg{color:var(--ok)}

/* Segmented tabs */
.tabs{display:inline-flex;gap:2px;padding:4px;border-radius:14px;background:var(--surface-2);margin:56px auto 18px}
.tabs button{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:500;padding:8px 14px;border-radius:10px;cursor:pointer;transition:color .15s,background .15s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--ring)}
.tabs-row{display:flex;justify-content:center}
@media (max-width:560px){.tabs{max-width:100%;overflow-x:auto;scrollbar-width:none}.tabs button svg{display:none}.tabs button{padding:8px 10px;font-size:13.5px}}

/* Browser frame */
.frame{position:relative;max-width:1040px;margin:0 auto;border-radius:18px;background:var(--surface);box-shadow:var(--lift);overflow:hidden}
.frame-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:42px;padding:0 14px;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.url{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:8px;background:var(--surface-2);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.frame-body{min-height:440px;animation:fadeup .3s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(4px)}}
.hero-fade{height:120px;margin-top:-120px;position:relative;background:linear-gradient(transparent,var(--paper));pointer-events:none}

/* Mini app pieces (used in the hero preview and feature tiles) */
.mini-top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:13.5px}
.mini-top b{font-weight:600}
.timer-pill{margin-left:auto;font-family:var(--f-mono);font-size:13px;font-weight:500;padding:4px 10px;border-radius:8px;background:var(--surface-2)}
.mini-split{display:grid;grid-template-columns:1.1fr 1fr}
.mini-split > div{padding:22px 24px;min-width:0}
.mini-split > div + div{border-left:1px solid var(--line);background:var(--site)}
.mini-passage h4{font-family:var(--f-display);font-weight:500;font-size:22px;letter-spacing:-.02em;margin-bottom:10px}
.mini-passage p{font-size:14px;line-height:1.75;color:var(--ink-2)}
.mini-passage p + p{margin-top:10px}
.mini-passage .pl{font-family:var(--f-mono);font-size:11px;color:var(--muted-2);margin-right:8px}
.mini-q{display:grid;gap:10px;padding:14px;border-radius:12px;background:var(--surface);box-shadow:var(--ring);margin-bottom:10px}
.mini-q .qn{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.mini-q p{font-size:14px;font-weight:500}
.mini-opts{display:flex;gap:6px;flex-wrap:wrap}
.mini-opts span{font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:5px 9px;border-radius:7px;box-shadow:var(--ring);background:var(--surface)}
.mini-opts span.sel{background:var(--trap-soft);color:var(--trap);box-shadow:0 0 0 1px color-mix(in srgb,var(--trap) 40%,transparent)}
.mini-opts span.cor{background:var(--ok-soft);color:var(--ok);box-shadow:0 0 0 1px color-mix(in srgb,var(--ok) 40%,transparent)}
.mini-note{display:grid;gap:4px;font-size:13px;padding:10px 12px;border-radius:10px;background:var(--trap-soft)}
.mini-note b{color:var(--trap);font-size:12px;font-weight:600}
.mini-nav{display:flex;gap:5px;padding:12px 18px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.mini-nav i{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:11px;box-shadow:var(--ring);background:var(--surface)}
.mini-nav i.d{background:var(--ink);color:var(--paper);box-shadow:none}
.mini-nav i.f{box-shadow:0 0 0 1.5px var(--warn)}
.mini-nav span{font-size:12px;color:var(--muted);margin-right:6px}
@media (max-width:720px){.mini-split{grid-template-columns:1fr}.mini-split > div + div{border-left:0;border-top:1px solid var(--line)}}

.mini-report{display:grid;grid-template-columns:.8fr 1.2fr;gap:0}
.mini-report > div{padding:26px 28px;min-width:0}
.mini-report > div + div{border-left:1px solid var(--line)}
.big-band{font-family:var(--f-display);font-weight:500;font-size:96px;letter-spacing:-.05em;line-height:.9}
.k{font-size:12.5px;color:var(--muted);font-weight:500}
.bars{display:grid;gap:14px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.bar-row b{font-weight:500}
.bar-row .n{font-family:var(--f-mono);font-size:13px;color:var(--trap)}
.bar-row .tr{grid-column:1/-1;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar-row .tr i{display:block;height:100%;border-radius:9px;background:var(--trap)}
@media (max-width:720px){.mini-report{grid-template-columns:1fr}.mini-report > div + div{border-left:0;border-top:1px solid var(--line)}}

.mini-dash{display:grid;grid-template-columns:180px 1fr;min-height:440px}
.mini-side{border-right:1px solid var(--line);padding:16px 12px;display:grid;gap:2px;align-content:start;background:var(--site)}
.mini-side span{display:flex;gap:9px;align-items:center;font-size:13.5px;padding:7px 10px;border-radius:8px;color:var(--muted)}
.mini-side span.on{background:var(--surface);color:var(--ink);box-shadow:var(--ring)}
.mini-main{padding:22px 24px;display:grid;gap:16px;align-content:start;min-width:0}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:14px;border-radius:12px;box-shadow:var(--ring);background:var(--surface);display:grid;gap:4px}
.stat .v{font-size:24px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .d{font-size:12px;color:var(--ok);font-family:var(--f-mono)}
.stat .d.neg{color:var(--trap)}
@media (max-width:720px){.mini-dash{grid-template-columns:1fr}.mini-side{display:none}.stat-grid{grid-template-columns:1fr 1fr}}

.dark-player{background:#0A0A0A;color:#EDEDED;border-radius:14px;padding:16px 18px;display:grid;gap:10px}
.dark-player .row{display:flex;gap:12px;align-items:center}
.dark-player .pbtn{width:40px;height:40px;border-radius:50%;background:#FAFAFA;color:#0A0A0A;display:grid;place-items:center;flex:none}
.dark-player .wv{flex:1;display:flex;gap:2px;align-items:center;height:30px;min-width:0;overflow:hidden}
.dark-player .wv i{flex:1;min-width:2px;max-width:4px;border-radius:2px;background:rgba(255,255,255,.2)}
.dark-player .wv i.on{background:#FAFAFA}
.dark-player small{font-family:var(--f-mono);font-size:11.5px;color:#A1A1A1}
.mini-form{border-radius:12px;box-shadow:var(--ring);background:var(--surface);overflow:hidden}
.mini-form .fr{display:grid;grid-template-columns:24px 1fr 1.2fr;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:13.5px}
.mini-form .fr:first-child{border-top:0}
.mini-form .fr i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mini-form .fr span{color:var(--muted)}
.mini-form .fr em{font-style:normal;font-family:var(--f-mono);font-size:12.5px;padding:4px 8px;border-radius:6px;background:var(--surface-2)}
.mini-form .fr em.bad{background:var(--trap-soft);color:var(--trap);text-decoration:line-through}
.mini-form .fr em.good{background:var(--ok-soft);color:var(--ok)}

/* Quote + numbers */
.quote{max-width:760px;margin:0 auto;text-align:center;font-family:var(--f-display);font-size:clamp(26px,3.6vw,38px);line-height:1.25;letter-spacing:-.02em;font-weight:450}
.quote s{text-decoration-thickness:2px;color:var(--muted)}
.quote-by{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:22px;font-size:14px;color:var(--muted)}
.quote-by .logo-mark{width:24px;height:24px;font-size:15px}
.numbers{display:grid;grid-template-columns:repeat(3,1fr);max-width:860px;margin:64px auto 0;border-radius:20px;box-shadow:var(--ring);background:var(--surface)}
.numbers div{padding:30px 24px;display:grid;gap:6px;justify-items:center;text-align:center}
.numbers div + div{border-left:1px solid var(--line)}
.numbers b{font-family:var(--f-display);font-weight:450;font-size:clamp(44px,6vw,64px);letter-spacing:-.04em;line-height:1}
.numbers span{font-size:14px;color:var(--muted)}
@media (max-width:640px){.numbers{grid-template-columns:1fr}.numbers div + div{border-left:0;border-top:1px solid var(--line)}}

/* Feature tiles */
.tiles-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ftile{background:var(--tile);border-radius:24px;padding:28px 28px 0;display:grid;grid-template-rows:auto 1fr;gap:22px;overflow:hidden;min-width:0}
.ftile.wide{grid-column:1/-1}
.ftile-head{display:grid;gap:6px;max-width:440px}
.ftile-head h3{font-size:17px;display:flex;gap:6px;align-items:center}
.ftile-head p{color:var(--muted);font-size:15px}
.ftile-body{align-self:end;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:var(--ring);padding:20px;display:grid;gap:12px;min-width:0}
@media (max-width:820px){.tiles-grid{grid-template-columns:1fr}.ftile{padding:22px 20px 0}}

/* Demo inside tile */
.cbt{display:grid;gap:12px}
.excerpt{font-size:14.5px;line-height:1.7;color:var(--ink-2);padding-left:12px;border-left:2px solid var(--line)}
.statement{font-weight:600;font-size:15.5px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{height:40px;border:0;background:var(--surface);box-shadow:var(--ring);border-radius:10px;font-weight:600;font-size:12.5px;letter-spacing:.03em;cursor:pointer;transition:box-shadow .12s,background .12s}
.opt:hover{box-shadow:var(--ring-hover);background:var(--site)}
.opt.right{background:var(--ok-soft);color:var(--ok);box-shadow:0 0 0 1px color-mix(in srgb,var(--ok) 45%,transparent)}
.opt.wrong{background:var(--trap-soft);color:var(--trap);box-shadow:0 0 0 1px color-mix(in srgb,var(--trap) 45%,transparent)}
.feedback{border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:8px}
.feedback.bad{background:var(--trap-soft)}
.feedback.good{background:var(--ok-soft)}
.feedback .btn{justify-self:start;height:34px;font-size:13.5px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;height:24px;padding:0 9px;border-radius:7px;white-space:nowrap}
.chip-trap{background:var(--trap-soft);color:var(--trap)}
.chip-ok{background:var(--ok-soft);color:var(--ok)}
.chip-neutral{background:var(--surface-2);color:var(--muted)}
.chip-biro{background:var(--biro-soft);color:var(--biro)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-radius:20px;box-shadow:var(--ring);background:var(--surface)}
.step{padding:28px;display:grid;gap:10px;align-content:start}
.step + .step{border-left:1px solid var(--line)}
.step .num{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--muted-2);font-weight:450}
.step h3{font-size:17px}
.step p{color:var(--muted);font-size:15px}
@media (max-width:820px){.steps{grid-template-columns:1fr}.step + .step{border-left:0;border-top:1px solid var(--line)}}

/* Trap library */
.traps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--ring)}
.trap-card{background:var(--surface);padding:24px;display:grid;gap:8px;align-content:start}
.trap-card h4{font-size:15.5px;display:flex;align-items:center;gap:9px}
.trap-card h4::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--trap);flex:none}
.trap-card p{color:var(--muted);font-size:14.5px}
.trap-card .where{font-family:var(--f-mono);font-size:11.5px;color:var(--muted-2)}
@media (max-width:900px){.traps-grid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.traps-grid{grid-template-columns:1fr}}

/* Pricing */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
.plan{position:relative;display:flex;flex-direction:column;gap:18px;padding:26px;border-radius:20px;background:var(--surface);box-shadow:var(--ring)}
.plan.pop{background:var(--ink);color:var(--paper);box-shadow:var(--lift)}
.plan.pop .sub,.plan.pop .price .per,.plan.pop li.no{color:color-mix(in srgb,var(--paper) 60%,transparent)}
.plan.pop li::before{color:var(--paper)}
.plan.pop .btn-primary{background:var(--paper);color:var(--ink)}
.plan .badge{position:absolute;top:22px;right:22px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--paper) 14%,transparent);color:var(--paper)}
.plan h3{font-size:15px;font-weight:500}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price .amt{font-family:var(--f-display);font-size:54px;font-weight:450;letter-spacing:-.04em;line-height:1}
.price .per{color:var(--muted);font-size:14px}
.plan .sub{color:var(--muted);font-size:14px;margin-top:-8px}
.plan ul{list-style:none;padding:18px 0 0;margin:0;display:grid;gap:10px;font-size:14.5px;border-top:1px solid color-mix(in srgb,currentColor 12%,transparent)}
.plan li{display:flex;gap:10px}
.plan li::before{content:"✓";color:var(--ok);font-weight:600;flex:none}
.plan li.no{color:var(--muted)}
.plan li.no::before{content:"–";color:var(--muted-2)}
.plan .btn{margin-top:auto}
@media (max-width:900px){.plans{grid-template-columns:1fr;max-width:440px;margin:0 auto}.plan.pop{order:-1}}
.assure{display:flex;gap:8px 22px;flex-wrap:wrap;justify-content:center;margin-top:24px;color:var(--muted);font-size:13.5px}

/* FAQ */
.faq{display:grid;max-width:720px;margin:0 auto;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:20px 0;font-weight:500;font-size:16px;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--muted);font-size:20px;line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 20px;color:var(--muted);max-width:620px}

/* Final CTA */
.final{display:grid;gap:22px;justify-items:center;text-align:center;padding:88px 24px;border-radius:28px;background:var(--tile)}
.final h2{font-size:clamp(36px,5.4vw,60px);max-width:720px}
.final p{color:var(--muted);font-size:17px;max-width:520px}
footer{padding-block:56px 64px;color:var(--muted);font-size:14px;border-top:1px solid var(--line);margin-top:96px}
.foot{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:28px}
.foot h5{margin:0 0 12px;font-size:13px;font-weight:500;color:var(--ink)}
.foot a{display:block;text-decoration:none;padding:4px 0}
.foot a:hover{color:var(--ink)}
.foot a.logo{display:flex}
.foot .fine{grid-column:1/-1;padding-top:24px;border-top:1px solid var(--line);font-size:12.5px}
@media (max-width:720px){.foot{grid-template-columns:1fr 1fr}.foot > div:first-child{grid-column:1/-1}}

/* Sticky mobile CTA */
.sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:none}
@media (max-width:760px){.sticky-cta.show{display:block}}

/* Onboarding */
.onb{max-width:620px;margin:0 auto;padding-block:56px 96px;display:grid;gap:30px}
.progress{display:flex;gap:6px}
.progress i{height:4px;flex:1;border-radius:9px;background:var(--surface-2)}
.progress i.on{background:var(--ink)}
.onb h1{font-size:clamp(34px,5.4vw,48px)}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choice{border:0;background:var(--surface);box-shadow:var(--ring);border-radius:14px;padding:16px 18px;text-align:left;cursor:pointer;display:grid;gap:4px;transition:box-shadow .15s,background .15s}
.choice:hover{box-shadow:var(--ring-hover);background:var(--site)}
.choice[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink);background:var(--surface)}
.choice b{font-family:var(--f-display);font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.05}
.choice span{color:var(--muted);font-size:13.5px}
.choice-grid.two{grid-template-columns:1fr 1fr}
.choice-grid.two .choice b{font-family:var(--f-body);font-size:16px;font-weight:500;letter-spacing:-.01em}
.test-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.test-pick .choice{padding:22px;gap:8px}
.test-pick .choice b{font-size:24px}
.locked{opacity:.55}
@media (max-width:560px){.choice-grid{grid-template-columns:1fr 1fr}.test-pick{grid-template-columns:1fr}}

/* Test */
.testbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
.testbar .wrap{display:flex;align-items:center;gap:10px;height:56px;max-width:none}
.testbar .title{font-weight:600;font-size:14.5px}
.testbar .title .long{color:var(--muted);font-weight:400}
.testbar .timer{margin-left:auto;font-family:var(--f-mono);font-size:15px;font-weight:500;padding:0 12px;height:34px;display:grid;place-items:center;border-radius:9px;background:var(--surface-2)}
.testbar .timer.low{background:var(--trap-soft);color:var(--trap)}
.testbar .btn{height:34px;padding:0 14px;font-size:14px}
.test-body{display:grid;grid-template-columns:1fr 1fr;height:calc(100dvh - 56px - 56px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:420px}
.pane{overflow:auto;padding:36px max(24px,env(safe-area-inset-left,0px)) 48px;min-width:0}
.pane + .pane{border-left:1px solid var(--line);background:var(--site)}
.passage{max-width:620px;margin:0 auto;font-size:16px;line-height:1.8;color:var(--ink-2)}
.passage h2{font-size:32px;margin-bottom:4px;color:var(--ink)}
.passage .para{display:grid;grid-template-columns:26px 1fr;gap:4px;margin-top:18px}
.passage .para b{font-family:var(--f-mono);color:var(--muted-2);font-size:12px;font-weight:500;padding-top:5px}
.hint-hl{font-size:12.5px;color:var(--muted);margin-bottom:22px;display:inline-flex;gap:8px;align-items:center;padding:5px 10px;border-radius:8px;background:var(--surface-2)}
.qgroup{max-width:600px;margin:0 auto 36px;display:grid;gap:12px}
.qgroup .instr{font-size:14px;color:var(--muted);padding:14px 16px;border-radius:12px;background:var(--surface);box-shadow:var(--ring)}
.qgroup .instr b{font-weight:600;color:var(--ink)}
.q{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:start;padding:18px;border-radius:14px;background:var(--surface);box-shadow:var(--ring);scroll-margin-top:80px;transition:box-shadow .15s}
.q .n{font-family:var(--f-mono);font-size:12.5px;font-weight:500;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.q.answered .n{background:var(--ink);color:var(--paper)}
.q .qt{display:grid;gap:12px;min-width:0}
.q .qtext{font-size:15.5px;line-height:1.6}
.flag{background:none;border:0;cursor:pointer;color:var(--muted-2);font-size:12.5px;padding:4px 8px;border-radius:7px;white-space:nowrap}
.flag:hover{color:var(--ink);background:var(--surface-2)}
.flag[aria-pressed="true"]{color:var(--warn);background:var(--warn-soft)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:0;background:var(--surface);box-shadow:var(--ring);border-radius:9px;height:34px;padding:0 12px;font-size:12.5px;font-weight:600;letter-spacing:.03em;cursor:pointer;transition:box-shadow .12s,background .12s}
.seg button:hover{box-shadow:var(--ring-hover);background:var(--site)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.mcq{display:grid;gap:6px}
.mcq button{text-align:left;display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;border:0;background:var(--surface);box-shadow:var(--ring);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14.5px;line-height:1.5}
.mcq button:hover{box-shadow:var(--ring-hover);background:var(--site)}
.mcq button[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--ink)}
.mcq button b{font-family:var(--f-mono);font-weight:500;font-size:12.5px;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--surface-2)}
.mcq button[aria-pressed="true"] b{background:var(--ink);color:var(--paper)}
.gap-in{border:0;box-shadow:var(--ring);background:var(--surface);border-radius:9px;height:36px;padding:0 12px;width:min(240px,100%);font-family:var(--f-mono);font-size:14px;transition:box-shadow .12s}
.gap-in:focus{outline:none;box-shadow:0 0 0 1.5px var(--ink),0 0 0 5px color-mix(in srgb,var(--ink) 8%,transparent)}
.form-sheet{border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--ring)}
.form-sheet h4{padding:14px 18px;font-size:14px;border-bottom:1px solid var(--line)}
.form-row{display:grid;grid-template-columns:32px minmax(110px,160px) 1fr auto;gap:10px;align-items:center;padding:10px 18px;border-top:1px solid var(--line-2);scroll-margin-top:80px}
.form-row:first-of-type{border-top:0}
.form-row .n{font-family:var(--f-mono);font-size:12.5px;font-weight:500;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.form-row.answered .n{background:var(--ink);color:var(--paper)}
.form-row .lab{color:var(--muted);font-size:14px}
.form-row .val{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;font-size:14.5px}
.boxlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;padding:12px;border-radius:14px;background:var(--surface);box-shadow:var(--ring);font-size:14px}
.boxlist span{display:flex;gap:8px;align-items:center;padding:6px 8px}
.boxlist b{font-family:var(--f-mono);font-size:12px;font-weight:500;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--surface-2)}
.navigator{position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);height:calc(56px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.navigator .wrap{display:flex;gap:5px;align-items:center;height:56px;overflow-x:auto;max-width:none}
.navigator .lbl{font-size:12.5px;color:var(--muted);margin-right:8px;white-space:nowrap}
.navigator button{flex:none;width:30px;height:30px;border-radius:8px;border:0;box-shadow:var(--ring);background:var(--surface);font-family:var(--f-mono);font-size:12px;cursor:pointer;position:relative;color:var(--muted)}
.navigator button:hover{box-shadow:var(--ring-hover);color:var(--ink)}
.navigator button.done{background:var(--ink);color:var(--paper);box-shadow:none}
.navigator button.flagged::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--paper)}
.pane-tabs{display:none}
@media (max-width:860px){
  .test-body{grid-template-columns:1fr;height:auto;min-height:0}
  .pane{overflow:visible;padding:24px max(16px,env(safe-area-inset-left,0px)) 110px}
  .pane + .pane{border-left:0}
  .test-body[data-show="passage"] .pane-q{display:none}
  .test-body[data-show="questions"] .pane-p{display:none}
  .pane-tabs{display:flex;justify-content:center;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:44}
  .pane-tabs .tabs{margin:0}
  .form-row{grid-template-columns:32px 1fr auto}
  .form-row .val{grid-column:2 / 4}
  .testbar .title .long{display:none}
  .q{padding:14px}
}

/* Audio player */
.player{display:grid;gap:12px;max-width:600px;margin:0 auto 28px;padding:18px 20px;border-radius:16px;background:#0A0A0A;color:#EDEDED}
.player-row{display:flex;align-items:center;gap:14px}
.play{width:48px;height:48px;border-radius:50%;border:0;background:#FAFAFA;color:#0A0A0A;font-size:16px;cursor:pointer;display:grid;place-items:center;flex:none;transition:transform .1s}
.play:active{transform:scale(.95)}
.play[disabled]{opacity:.7;cursor:default}
.wave{flex:1;height:34px;display:flex;align-items:center;gap:3px;min-width:0;overflow:hidden}
.wave i{flex:1;min-width:2px;max-width:4px;border-radius:2px;background:rgba(255,255,255,.18);height:30%}
.wave i.on{background:#FAFAFA}
.player.playing .wave i.on{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scaleY(.7)}to{transform:scaleY(1.12)}}
.player small{color:#A1A1A1;font-size:13px}
.player .now{font-family:var(--f-mono);font-size:12.5px;color:#D4D4D4}

/* Results */
.res-head{display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:center;padding:36px;border-radius:22px;background:var(--surface);box-shadow:var(--ring)}
.band-big{font-family:var(--f-display);font-weight:500;font-size:128px;line-height:.85;letter-spacing:-.05em;color:var(--ink)}
.band-label{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:10px}
.res-meta{display:grid;gap:14px;min-width:0}
.res-meta h1{font-size:clamp(28px,3.6vw,38px)}
.scale{position:relative;height:50px;margin-top:10px}
.scale .track{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:9px;background:var(--surface-2)}
.scale .tick{position:absolute;top:32px;font-family:var(--f-mono);font-size:11px;color:var(--muted-2);transform:translateX(-50%)}
.scale .pin{position:absolute;top:12px;width:3px;height:22px;border-radius:3px;background:var(--ink);transform:translateX(-50%)}
.scale .pin.target{background:var(--muted-2)}
.scale .pin span{position:absolute;bottom:26px;left:0;font-size:11.5px;font-weight:500;white-space:nowrap;color:var(--muted)}
@media (max-width:640px){.res-head{grid-template-columns:1fr;gap:18px;padding:24px}.band-big{font-size:96px}}
.grid-2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}
@media (max-width:900px){.grid-2{grid-template-columns:1fr}}
.panel{background:var(--surface);border-radius:20px;box-shadow:var(--ring);padding:24px;display:grid;gap:16px;align-content:start;min-width:0}
.panel h3{font-size:16px}
.trap-row{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:14px 0;border-top:1px solid var(--line-2)}
.trap-row:first-of-type{border-top:0;padding-top:0}
.trap-row .nm{font-weight:500;display:flex;gap:9px;align-items:center}
.trap-row .nm::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--trap)}
.trap-row .cnt{font-family:var(--f-mono);font-size:13px;color:var(--trap)}
.trap-row .bar{grid-column:1 / -1;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.trap-row .bar i{display:block;height:100%;background:var(--trap);border-radius:9px}
.trap-row p{grid-column:1 / -1;color:var(--muted);font-size:14px}
.insight{background:var(--tile);border-radius:18px;padding:20px 22px;display:grid;gap:8px}
.insight b{font-family:var(--f-display);font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.15}
.insight .muted{font-size:14.5px}
.review{display:grid;gap:10px;margin-top:18px}
.rv{background:var(--surface);border-radius:16px;box-shadow:var(--ring);padding:18px 20px;display:grid;grid-template-columns:30px 1fr;gap:14px}
.rv .n{font-family:var(--f-mono);font-size:12.5px;font-weight:500;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.rv.ok .n{background:var(--ok-soft);color:var(--ok)}
.rv.bad .n{background:var(--trap-soft);color:var(--trap)}
.rv .body{display:grid;gap:10px;min-width:0}
.rv .ans{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;align-items:center;color:var(--muted)}
.rv .ans b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.rv .why{font-size:14.5px;color:var(--muted)}
.rv blockquote{margin:0;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--site);box-shadow:inset 0 0 0 1px var(--line-2)}
.cta-panel{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:26px 28px;border-radius:20px;background:var(--ink);color:var(--paper);margin-top:16px}
.cta-panel h3{font-family:var(--f-display);font-size:26px;font-weight:500;letter-spacing:-.02em}
.cta-panel p{opacity:.65;font-size:14.5px;margin-top:4px}
.cta-panel .btn-primary{background:var(--paper);color:var(--ink)}
.h-section{font-size:30px;margin-top:48px}

/* Gate */
.gate{max-width:980px;margin:0 auto;padding-block:64px 96px;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.gate h1{font-size:clamp(34px,4.8vw,48px)}
.gate-preview{position:relative;border-radius:22px;overflow:hidden;background:var(--tile);padding:28px;display:grid;gap:14px}
.gate-preview .blur{filter:blur(8px);user-select:none;pointer-events:none;display:grid;gap:14px}
.gate-preview .lock{position:absolute;inset:auto 18px 18px 18px;background:var(--surface);border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:500;display:flex;gap:8px;align-items:center;box-shadow:var(--lift)}
.field{display:grid;gap:7px}
.field label{font-weight:500;font-size:14px}
.field input,.field select{border:0;box-shadow:var(--ring);background:var(--surface);border-radius:10px;height:44px;padding:0 14px;font-size:15.5px;width:100%;transition:box-shadow .12s}
.field input:focus{outline:none;box-shadow:0 0 0 1.5px var(--ink),0 0 0 5px color-mix(in srgb,var(--ink) 8%,transparent)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--ink)}
.err{color:var(--trap);font-size:13.5px;font-weight:500}
@media (max-width:820px){.gate{grid-template-columns:1fr;padding-block:32px 64px}.gate-preview{order:2}}

/* Dashboard */
.dash-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:end;padding-block:44px 24px}
.dash-head h1{font-size:clamp(32px,4.4vw,46px)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--surface);border:0;box-shadow:var(--ring);border-radius:18px;padding:18px;display:grid;gap:6px;align-content:start;position:relative;transition:box-shadow .15s}
.tile .k{font-size:13px;font-weight:500;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-size:48px;font-weight:500;letter-spacing:-.04em;line-height:1}
.tile .s{font-size:13px;color:var(--muted)}
.tile.lock{background:var(--tile);box-shadow:none}
.tile.lock .v{color:var(--muted-2)}
.tile.hero-tile{background:var(--ink);color:var(--paper);box-shadow:none}
.tile.hero-tile .k,.tile.hero-tile .s{color:color-mix(in srgb,var(--paper) 65%,transparent)}
button.tile:hover{box-shadow:var(--ring-hover)}
@media (max-width:820px){.tiles{grid-template-columns:1fr 1fr}}
.spark{width:100%;height:40px;margin-top:4px}
.hist{display:grid}
.hist .row{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:12px 0;border-top:1px solid var(--line-2);align-items:center;font-size:14.5px}
.hist .row:first-child{border-top:0;padding-top:0}
.plan-list{display:grid;gap:8px}
.plan-item{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--site);box-shadow:inset 0 0 0 1px var(--line-2)}
.plan-item .i{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.plan-item b{font-weight:500;font-size:14.5px}
.plan-item p{font-size:13.5px;color:var(--muted)}
.plan-item .btn{height:30px;padding:0 12px;font-size:13px}
.plan-item.lock{opacity:.75}
.empty{padding:72px 24px;text-align:center;display:grid;gap:16px;justify-items:center;background:var(--tile);border-radius:26px}
.empty h2{font-size:clamp(30px,4vw,40px)}

/* Modal */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.4);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);color:var(--ink);border-radius:20px;max-width:440px;width:100%;padding:24px;display:grid;gap:14px;box-shadow:var(--lift);animation:fadeup .2s ease}
.modal h3{font-family:var(--f-display);font-size:26px;font-weight:500;letter-spacing:-.02em}
.modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:110;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:var(--lift);animation:fadeup .2s ease}
.slidein{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:20px;z-index:90;max-width:340px;background:var(--surface);border-radius:18px;padding:20px;display:grid;gap:10px;box-shadow:var(--lift);animation:fadeup .25s ease}
.slidein b{font-family:var(--f-display);font-size:22px;font-weight:500;letter-spacing:-.02em}

/* Checkout */
.co{max-width:920px;margin:0 auto;padding-block:56px 96px;display:grid;grid-template-columns:1fr 1fr;gap:32px}
.co h1{font-size:clamp(32px,4.4vw,44px)}
@media (max-width:820px){.co{grid-template-columns:1fr}}
.sum-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line-2);font-size:14.5px}
.sum-row:first-of-type{border-top:0}
.sum-row.total{font-weight:600;font-size:16px;border-top:1px solid var(--line)}

/* Admin */
.admin{padding-block:40px 96px;display:grid;gap:16px}
.admin h1{font-size:40px}
.funnel{display:grid;gap:6px}
.fstep{display:grid;grid-template-columns:minmax(120px,170px) 1fr 54px 60px;gap:12px;align-items:center;font-size:14px}
.fstep .b{height:24px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.fstep .b i{display:block;height:100%;background:var(--ink);border-radius:6px;min-width:2px}
.fstep.drop .b i{background:var(--trap)}
.fstep .c{font-family:var(--f-mono);font-size:13px;text-align:right}
.fstep .p{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.fstep.drop .p{color:var(--trap)}
@media (max-width:640px){.fstep{grid-template-columns:1fr 54px 60px}.fstep .b{grid-column:1 / -1;order:5}}
.tbl-wrap{overflow-x:auto;border-radius:14px;box-shadow:var(--ring);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:760px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--site);border-bottom:1px solid var(--line)}
td .mono{font-size:12.5px}
.filters{display:inline-flex;gap:2px;padding:4px;border-radius:12px;background:var(--surface-2);flex-wrap:wrap}
.filters button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:6px 12px;font-size:13.5px;font-weight:500;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--ring)}
.status-pill{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:500;height:28px;padding:0 11px;border-radius:999px;background:var(--surface);box-shadow:var(--ring)}
.status-pill i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.status-pill.on i{background:var(--ok)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sample-tag{display:inline-flex;align-items:center;height:24px;font-size:12px;font-weight:500;color:var(--warn);background:var(--warn-soft);padding:0 9px;border-radius:7px}

@media (max-width:720px){.dash-mini-cols{grid-template-columns:1fr!important}}

/* ===== Exam screen: plain, high-contrast, fixed timer (after the computer-delivered IELTS) ===== */
.exam{--ex-bg:#FFFFFF;--ex-fg:#000000;--ex-sub:#3D3D3D;--ex-panel:#F2F2F2;--ex-line:#BDBDBD;--ex-line-2:#E2E2E2;--ex-sel:#1A1A1A;--ex-sel-fg:#FFFFFF;--ex-focus:#1F5FD6;--ex-warn:#B25E00;--ex-warn-bg:#FFF1DC;--ex-crit:#C4161C;--ex-crit-bg:#FDE4E4;--ex-hl:#FFE873;--ex-flag:#B25E00;
  position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;background:var(--ex-bg);color:var(--ex-fg);
  font-family:Arial,"Helvetica Neue",Helvetica,var(--f-body);font-size:var(--efs,17px);line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
.exam[data-scheme="wb"]{--ex-bg:#000000;--ex-fg:#FFFFFF;--ex-sub:#D6D6D6;--ex-panel:#161616;--ex-line:#6E6E6E;--ex-line-2:#2E2E2E;--ex-sel:#FFFFFF;--ex-sel-fg:#000000;--ex-focus:#7FB2FF;--ex-warn:#FFB547;--ex-warn-bg:#3A2700;--ex-crit:#FF6B6B;--ex-crit-bg:#3D0B0B;--ex-hl:#7A6500;--ex-flag:#FFB547;color-scheme:dark}
.exam[data-scheme="yb"]{--ex-bg:#000000;--ex-fg:#FFE600;--ex-sub:#F2DB3A;--ex-panel:#141200;--ex-line:#8C7E00;--ex-line-2:#2C2800;--ex-sel:#FFE600;--ex-sel-fg:#000000;--ex-focus:#FFFFFF;--ex-warn:#FFFFFF;--ex-warn-bg:#5A3B00;--ex-crit:#FFFFFF;--ex-crit-bg:#8A0F0F;--ex-hl:#5C5200;--ex-flag:#FFFFFF;color-scheme:dark}
.exam *:focus-visible{outline:3px solid var(--ex-focus);outline-offset:2px}
.exam b{font-weight:700}
.exam .mono{font-family:var(--f-mono)}

/* Top bar */
.ex-top{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;height:58px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--ex-panel);border-bottom:1px solid var(--ex-line)}
.ex-cand{display:flex;align-items:center;gap:10px;min-width:0}
.ex-logo{width:28px;height:28px;border-radius:6px;background:var(--ex-fg);color:var(--ex-bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:18px;flex:none}
.ex-cand-txt{display:grid;line-height:1.25;min-width:0}
.ex-cand-txt b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-cand-txt small{font-size:12.5px;color:var(--ex-sub)}
.ex-time{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--ex-line);background:var(--ex-bg);font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;transition:background .3s,color .3s,border-color .3s}
.ex-time small{font-family:Arial,var(--f-body);font-size:13px;font-weight:400;color:var(--ex-sub);margin-left:6px}
.ex-time.warn{color:var(--ex-warn);background:var(--ex-warn-bg);border-color:var(--ex-warn)}
.ex-time.crit{color:var(--ex-crit);background:var(--ex-crit-bg);border-color:var(--ex-crit)}
.ex-time.warn small,.ex-time.crit small{color:inherit}
.ex-tools{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.ex-btn{height:36px;padding:0 14px;border-radius:7px;border:1px solid var(--ex-line);background:var(--ex-bg);color:var(--ex-fg);font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.ex-btn:hover{border-color:var(--ex-fg)}
.ex-btn.solid{background:var(--ex-sel);color:var(--ex-sel-fg);border-color:var(--ex-sel)}
.ex-btn.icon{width:40px;padding:0;font-family:var(--f-display);font-size:17px}
.ex-btn.lg{height:46px;padding:0 22px;font-size:16px}
.ex-set-wrap{position:relative}
.ex-settings{position:absolute;right:0;top:44px;z-index:5;width:240px;padding:14px;border-radius:10px;background:var(--ex-bg);border:1px solid var(--ex-line);box-shadow:0 18px 40px -18px rgba(0,0,0,.4);display:grid;gap:8px}
.ex-set-lab{font-size:13px;font-weight:700}
.ex-set-row{display:flex;gap:6px}
.ex-set-row button{flex:1;height:40px;border-radius:7px;border:1px solid var(--ex-line);background:var(--ex-bg);color:var(--ex-fg);font-weight:700;cursor:pointer;font-family:Arial,var(--f-body)}
.ex-set-row button[aria-pressed="true"]{outline:3px solid var(--ex-focus);outline-offset:1px}
.ex-set-row .sw-bw{background:#fff;color:#000}.ex-set-row .sw-wb{background:#000;color:#fff}.ex-set-row .sw-yb{background:#000;color:#FFE600}
.ex-strip{flex:none;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:baseline;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--ex-line);font-size:.92em}
.ex-strip span{color:var(--ex-sub)}
.ex-tabs{display:none}

/* Body */
.ex-body{flex:1;min-height:0}
.ex-split{display:grid;grid-template-columns:1fr 1fr}
.ex-pane{overflow:auto;padding:28px max(24px,env(safe-area-inset-left,0px)) 40px;min-width:0;-webkit-overflow-scrolling:touch}
.ex-pane + .ex-pane{border-left:4px solid var(--ex-line-2)}
.ex-passage{max-width:44em;margin:0 auto}
.ex-passage h2{font-family:Arial,var(--f-body);font-weight:700;font-size:1.45em;letter-spacing:0;line-height:1.3;margin-bottom:6px}
.ex-passage .para{display:grid;grid-template-columns:1.8em 1fr;gap:4px;margin-top:1em}
.ex-passage .para b{font-weight:700}
.ex-passage mark.user-hl{background:var(--ex-hl);color:inherit}
.ex-hint{margin-top:2em;font-size:.82em;color:var(--ex-sub)}
.ex-single{overflow:auto;-webkit-overflow-scrolling:touch}
.ex-col{max-width:46em;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left,0px)) 48px}
.ex-group{max-width:44em;margin:0 auto 2em;display:grid;gap:.75em;transition:opacity .3s;scroll-margin-top:120px}
.ex-group.dim{opacity:.55}
.ex-group.dim:focus-within{opacity:1}
.ex-part-h{font-weight:700;font-size:1.1em;margin-top:.5em}
.ex-instr{padding:.8em 1em;border-left:4px solid var(--ex-fg);background:var(--ex-panel);font-size:.95em}
.ex-instr b{font-weight:700}
.ex-q{display:grid;grid-template-columns:2.1em 1fr auto;gap:.7em;align-items:start;padding:.9em .6em;border-bottom:1px solid var(--ex-line-2);scroll-margin:140px 0 90px;border-radius:6px}
.ex-q.cur,.ex-frow.cur{background:color-mix(in srgb,var(--ex-focus) 7%,transparent)}
.ex-n{display:grid;place-items:center;width:1.9em;height:1.9em;border:2px solid var(--ex-fg);border-radius:4px;font-weight:700;font-size:.9em}
.ex-n.sm{width:1.7em;height:1.7em;font-size:.82em}
.ex-q.answered .ex-n,.ex-frow.answered .ex-n{background:var(--ex-sel);color:var(--ex-sel-fg);border-color:var(--ex-sel)}
.ex-qt{display:grid;gap:.6em;min-width:0}
.ex-qtext{font-size:1em}
.ex-radios{display:grid;gap:.35em}
.ex-radio{display:flex;align-items:flex-start;gap:.7em;text-align:left;width:100%;min-height:2.6em;padding:.45em .7em;border:1px solid var(--ex-line);border-radius:6px;background:var(--ex-bg);color:var(--ex-fg);font:inherit;cursor:pointer}
.ex-radio:hover{border-color:var(--ex-fg)}
.ex-radio .dot{flex:none;width:1.1em;height:1.1em;margin-top:.25em;border-radius:50%;border:2px solid var(--ex-fg);display:grid;place-items:center}
.ex-radio[aria-checked="true"]{border-color:var(--ex-fg);box-shadow:inset 0 0 0 1px var(--ex-fg);font-weight:700}
.ex-radio[aria-checked="true"] .dot::after{content:"";width:.55em;height:.55em;border-radius:50%;background:var(--ex-fg)}
.ex-radio b{margin-right:.2em}
.ex-letters{display:flex;gap:.4em;flex-wrap:wrap}
.ex-letters button{width:2.6em;height:2.6em;border:1px solid var(--ex-line);border-radius:6px;background:var(--ex-bg);color:var(--ex-fg);font:inherit;font-weight:700;cursor:pointer}
.ex-letters button:hover{border-color:var(--ex-fg)}
.ex-letters button[aria-checked="true"]{background:var(--ex-sel);color:var(--ex-sel-fg);border-color:var(--ex-sel)}
.ex-in{height:2.3em;width:min(12em,100%);padding:0 .6em;border:1.5px solid var(--ex-fg);border-radius:4px;background:var(--ex-bg);color:var(--ex-fg);font:inherit;font-weight:700;vertical-align:middle}
.ex-in::placeholder{color:var(--ex-sub);font-weight:700;opacity:.6;text-align:center}
.ex-in:focus{outline:3px solid var(--ex-focus);outline-offset:1px}
.ex-flag{align-self:start;background:none;border:1px solid transparent;color:var(--ex-sub);font:inherit;font-size:.78em;padding:.25em .55em;border-radius:5px;cursor:pointer;white-space:nowrap}
.ex-flag:hover{border-color:var(--ex-line)}
.ex-flag[aria-pressed="true"]{color:var(--ex-flag);border-color:var(--ex-flag);font-weight:700}
.ex-form{border:1px solid var(--ex-line);border-radius:6px;overflow:hidden}
.ex-form h4{font-family:Arial,var(--f-body);font-size:1em;font-weight:700;letter-spacing:0;padding:.7em 1em;background:var(--ex-panel);border-bottom:1px solid var(--ex-line)}
.ex-frow{display:grid;grid-template-columns:minmax(8em,11em) 1fr auto;gap:.8em;align-items:center;padding:.65em 1em;border-top:1px solid var(--ex-line-2);scroll-margin:90px 0 90px}
.ex-frow:first-of-type{border-top:0}
.ex-frow .lab{color:var(--ex-sub)}
.ex-frow .val{display:flex;align-items:center;gap:.5em;flex-wrap:wrap;min-width:0}
.ex-box{display:grid;grid-template-columns:repeat(auto-fill,minmax(11em,1fr));gap:.3em 1em;padding:.8em 1em;border:1px solid var(--ex-line);border-radius:6px}
.ex-box b{display:inline-block;width:1.6em}

/* Listening player */
.ex-player-box{position:sticky;top:0;z-index:3;background:var(--ex-bg);padding-bottom:14px;margin-bottom:10px}
.ex-player{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"b m t" "p p p";gap:10px 14px;align-items:center;padding:14px 16px;border:1px solid var(--ex-line);border-radius:8px;background:var(--ex-panel)}
.ex-pbtn{grid-area:b;width:40px;height:40px;border-radius:50%;background:var(--ex-sel);color:var(--ex-sel-fg);display:grid;place-items:center;font-weight:700}
.ex-player.on .ex-pbtn{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(.92)}}
.ex-pmeta{grid-area:m;display:grid;line-height:1.3;min-width:0}
.ex-pmeta span{color:var(--ex-sub);font-size:.88em}
.ex-ptime{grid-area:t;font-size:.85em;color:var(--ex-sub)}
.ex-prog{grid-area:p;height:6px;border-radius:9px;background:var(--ex-line-2);overflow:hidden}
.ex-prog i{display:block;height:100%;background:var(--ex-fg);transition:width .4s linear}
.ex-player.done{grid-template-areas:"b m t"}
.ex-card{padding:1.2em 1.3em;border:1px solid var(--ex-line);border-radius:8px;background:var(--ex-panel);display:grid;gap:.8em;justify-items:start}
.ex-card h3{font-family:Arial,var(--f-body);font-size:1.15em;font-weight:700;letter-spacing:0}
.ex-card ul{margin:0;padding-left:1.2em;display:grid;gap:.3em}

/* Bottom navigation */
.ex-nav{flex:none;display:flex;align-items:center;gap:10px;height:60px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));border-top:1px solid var(--ex-line);background:var(--ex-panel)}
.ex-nav-scroll{flex:1;min-width:0;display:flex;gap:18px;overflow-x:auto;scrollbar-width:thin;align-items:center;height:100%}
.ex-part{display:flex;align-items:center;gap:5px;flex:none}
.ex-part-lab{font-weight:700;font-size:14px;margin-right:4px;white-space:nowrap}
.ex-nav button[data-q]{flex:none;width:34px;height:34px;border-radius:5px;border:1px solid var(--ex-line);background:var(--ex-bg);color:var(--ex-fg);font-family:Arial,var(--f-body);font-size:14px;font-weight:700;cursor:pointer;position:relative}
.ex-nav button.done{background:var(--ex-sel);color:var(--ex-sel-fg);border-color:var(--ex-sel)}
.ex-nav button.cur{outline:3px solid var(--ex-focus);outline-offset:1px}
.ex-nav button.flagged::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--ex-flag);border:2px solid var(--ex-panel)}
.ex-arrows{display:flex;gap:6px;flex:none}
.ex-arrows button{width:44px;height:40px;border-radius:6px;border:1px solid var(--ex-line);background:var(--ex-sel);color:var(--ex-sel-fg);font-size:24px;line-height:1;cursor:pointer}

/* Phones and small tablets */
@media (max-width:860px){
  .ex-top{grid-template-columns:auto 1fr auto;height:54px;gap:8px}
  .ex-cand-txt{display:none}
  .ex-time{justify-self:center;height:36px;padding:0 12px;font-size:17px}
  .ex-tools .ex-btn.ghost{display:none}
  .ex-tabs{flex:none;display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--ex-line)}
  .ex-tabs button{height:46px;border:0;background:var(--ex-bg);color:var(--ex-sub);font:inherit;font-size:15.5px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent}
  .ex-tabs button[aria-selected="true"]{color:var(--ex-fg);border-bottom-color:var(--ex-fg)}
  .ex-split{grid-template-columns:1fr;position:relative}
  .ex-split[data-show="passage"] .ex-pane-q,.ex-split[data-show="questions"] .ex-pane-p{display:none}
  .ex-pane{padding:18px 16px 28px}
  .ex-pane + .ex-pane{border-left:0}
  .ex-strip{padding:8px 16px;font-size:.85em}
  .ex-q{grid-template-columns:2em 1fr;padding:.8em .2em}
  .ex-q .ex-flag{grid-column:2;justify-self:start}
  .ex-frow{grid-template-columns:1fr auto}
  .ex-frow .val{grid-column:1 / -1;grid-row:2}
  .ex-nav{height:58px}
  .ex-nav-scroll{gap:12px}
  .ex-part-lab{font-size:12.5px}
  .ex-nav button[data-q]{width:36px;height:36px}
}
@media (max-width:860px){.ex-top .ex-tools .exit-sm{display:inline-flex}}
.tx{display:grid;gap:8px;max-height:360px;overflow:auto;padding-right:6px}
.tx p{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:14.5px}
.tx b{font-weight:500;color:var(--muted)}
@media (max-width:560px){.tx p{grid-template-columns:1fr;gap:0}}
.mode-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-pick .choice b{font-family:var(--f-body);font-size:16px;font-weight:600;letter-spacing:-.01em}
@media (max-width:560px){.mode-pick{grid-template-columns:1fr}}

const BANDS = {
  reading: [[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[0,2]],

};
function bandFor(module, raw, total) { const s = Math.round(raw / total * 40); return BANDS[module].find(([min]) => s >= min)[1]; }
const norm = s => String(s || "").toLowerCase().replace(/[£$]/g, "").replace(/:/g, ".").replace(/\s+/g, " ").trim().replace(/[,!]+$/, "").replace(/\.$/, "");
function checkQ(q, given) {
  if (q.type === "gap") {
    const g = norm(given); if (!g) return { ok: false, trap: "unanswered" };
    const acc = q.accept.map(norm);
    if (acc.includes(g) || acc.includes(g.replace(/\s+/g, ""))) return { ok: true };
    if (g.split(" ").filter(Boolean).length > q.limit) return { ok: false, trap: "word_limit" };
    if (q.distract && q.distract[g]) return { ok: false, trap: q.distract[g] };
    if (acc.some(a => a + "s" === g || a === g + "s" || a + "es" === g || a === g + "es")) return { ok: false, trap: "plural" };
    if (acc.some(a => !/^\d/.test(a) && lev(a, g) <= (a.length >= 5 ? 2 : 1))) return { ok: false, trap: "spelling" };
    return { ok: false, trap: q.def };
  }
  if (!given) return { ok: false, trap: "unanswered" };
  if (given === q.answer) return { ok: true };
  return { ok: false, trap: (q.traps && q.traps[given]) || q.def || "paraphrase_miss" };
}
function grade(module, answers, durationSec) {
  const qs = allQs(module);
  const items = qs.map(q => { const given = answers[q.id] || ""; const r = checkQ(q, given); return { q: q.id, n: q.n, given, correct: q.type === "gap" ? q.accept[0] : q.answer, ok: r.ok, trap: r.trap || null }; });
  const raw = items.filter(i => i.ok).length;
  return { id: uuid(), module, raw, total: qs.length, band: bandFor(module, raw, qs.length), duration: durationSec, at: new Date().toISOString(), items };
}
function trapCounts(items) { const c = {}; items.filter(i => !i.ok).forEach(i => c[i.trap] = (c[i.trap] || 0) + 1); return Object.entries(c).sort((a, b) => b[1] - a[1]); }

function scaleHTML(band, target) {
  const pos = b => ((b - 3) / 6 * 100);
  const ticks = [3,4,5,6,7,8,9].map(t => `<span class="tick" style="left:${pos(t)}%">${t}</span>`).join("");
  const youLeft = target && target > band; // labels point away from each other so they never overlap
  const tgt = target ? `<span class="pin target" style="left:${pos(Math.max(3,target))}%"><span style="transform:${youLeft ? "translateX(-2px)" : "translateX(calc(-100% + 2px))"}">Target ${fmtBand(target)}</span></span>` : "";
  return `<div class="scale" aria-label="Band scale"><div class="track"></div>${ticks}${tgt}<span class="pin" style="left:${pos(Math.max(3, band))}%"><span style="color:var(--ink);transform:${!target ? "translateX(-50%)" : youLeft ? "translateX(calc(-100% + 2px))" : "translateX(-2px)"}">You ${fmtBand(band)}</span></span></div>`;
}

function reportHTML(a, opt = {}) {
  const qs = a.qmeta ? [] : allQs(a.module); const tc = trapCounts(a.items);
  const target = opt.target ?? S.profile.target;
  const top = tc[0];
  let insight = "";
  if (top) { const nb = bandFor(a.module, a.raw + top[1], a.total); const lead = top[0] === "unanswered" ? `Answer every question and you’re at ${fmtBand(nb)}.` : `Fix “${esc(TRAPS[top[0]].name)}” and you’re at ${fmtBand(nb)}.`; insight = nb > a.band ? `<div class="insight"><b>${lead}</b><span class="muted">It cost you ${top[1]} mark${top[1] > 1 ? "s" : ""} on this test. ${esc(TRAPS[top[0]].fix)}</span></div>` : `<div class="insight"><b>Your top trap: ${esc(TRAPS[top[0]].name)}</b><span class="muted">${esc(TRAPS[top[0]].fix)}</span></div>`; }
  else insight = `<div class="insight"><b>No traps caught you this time.</b><span class="muted">Try a full mock to confirm your band under real timing.</span></div>`;
  const maxN = tc.length ? tc[0][1] : 1;
  const mod = (a.title ? esc(a.title) + " · " : "") + (a.module === "reading" ? "Reading" : "Listening");
  const gap = target ? (a.band >= target ? `You’ve reached your target of ${fmtBand(target)}.` : `${fmtBand(target - a.band)} band${target - a.band === 1 ? "" : "s"} below your target of ${fmtBand(target)}.`) : "";
  return `
  ${opt.sample ? `<p style="margin-bottom:12px"><span class="sample-tag">Sample report</span></p>` : ""}
  <div class="res-head">
    <div><p class="band-label">${mod} · estimated band</p><div class="band-big">${fmtBand(a.band)}</div></div>
    <div class="res-meta">
      <h1>${a.raw} of ${a.total} correct${a.duration ? ` <span class="muted" style="font-size:.6em;font-weight:500">in ${fmtTime(a.duration)}</span>` : ""}</h1>
      <p class="muted">${gap} Estimated from ${a.total === 40 ? "a full 40-question test" : `a ${a.total}-question diagnostic`} using the official raw-score-to-band scale.</p>
      ${a.mode ? `<div class="row-actions"><span class="chip chip-neutral">${a.mode === "exam" ? "Exam mode" : "Practice mode"}</span>${a.leftCount ? `<span class="chip chip-trap">Left the test window ${a.leftCount}×</span>` : ""}${a.transcript ? `<span class="chip chip-neutral">Transcript attempt</span>` : ""}</div>` : ""}
      ${scaleHTML(a.band, target)}
    </div>
  </div>
  <div class="grid-2">
    <div class="panel"><h3>What cost you marks</h3>
      ${tc.length ? tc.map(([k, n]) => `<div class="trap-row"><span class="nm">${esc(TRAPS[k].name)}</span><span class="cnt">−${n}</span><span class="bar"><i style="width:${n / maxN * 100}%"></i></span><p>${esc(TRAPS[k].what)}</p></div>`).join("") : `<p class="muted">Nothing. Every answer was correct.</p>`}
    </div>
    <div style="display:grid;gap:16px;align-content:start">
      ${insight}
      <div class="panel"><h3>At a glance</h3>
        <div class="hist">
          <div class="row"><span>Correct</span><span class="mono" style="color:var(--ok);font-weight:600">${a.raw}</span><span></span></div>
          <div class="row"><span>Caught by a trap</span><span class="mono" style="color:var(--trap);font-weight:600">${a.items.filter(i => !i.ok && i.trap !== "unanswered").length}</span><span></span></div>
          <div class="row"><span>Left blank</span><span class="mono" style="font-weight:600">${a.items.filter(i => i.trap === "unanswered").length}</span><span></span></div>
        </div>
      </div>
    </div>
  </div>
  ${opt.sample ? `<div class="cta-panel"><div><h3>Get your own report.</h3><p>Same analysis, built from your answers.</p></div><a href="#start" class="btn btn-primary btn-lg" data-track="sample_cta" data-step="cta_click">Take the free diagnostic</a></div>` : `
  <div class="cta-panel"><div><h3>Drill your top trap until it stops catching you.</h3><p>Exam Sprint builds daily practice from your own mistakes, paced to your test date.</p></div><button class="btn btn-primary btn-lg" data-action="choose-plan" data-plan="sprint" data-ctx="results" data-track="results_upgrade">Unlock my drills</button></div>
  <h2 class="h-section">Question by question</h2>
  <div class="review">${a.items.map(it => { const q = a.qmeta ? { ...a.qmeta[it.q], n: it.n, why: it.why, evidence: it.evidence, para: it.para } : qs.find(x => x.id === it.q); const t = it.trap ? TRAPS[it.trap] : null;

    </div></div>`; }).join("")}</div>

function sparkSVG(vals) {
  if (vals.length < 2) return "";
  const w = 200, h = 46, p = 5, min = 3, max = 9;
  const xy = vals.map((v, i) => [p + i * (w - 2 * p) / (vals.length - 1), h - p - (v - min) / (max - min) * (h - 2 * p)]);
  const d = xy.map((c, i) => (i ? "L" : "M") + c[0].toFixed(1) + " " + c[1].toFixed(1)).join(" ");
  const last = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L ${last[0]} ${h} L ${p} ${h} Z" fill="var(--biro-soft)"/><path d="${d}" fill="none" stroke="var(--biro)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--biro)"/></svg>`;
}

// Shared marking logic: used by the Supabase edge function and by the private preview build.
const BAND_TABLES = {
  reading: [[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[0,2]],
  listening: [[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[0,2]]
};
function bandFrom(module, raw, total) { const s = Math.round(raw / total * 40); return BAND_TABLES[module].find(([m]) => s >= m)[1]; }
function gNorm(s) { return String(s || "").toLowerCase().replace(/[£$]/g, "").replace(/:/g, ".").replace(/[’‘]/g, "'").replace(/\s+/g, " ").trim().replace(/[,!]+$/, "").replace(/\.$/, ""); }
function gLev(a, b) { const m = a.length, n = b.length; const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]); for (let j = 1; j <= n; j++) d[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return d[m][n]; }
function markGap(k, given) {
  const g = gNorm(given); if (!g) return { ok: false, trap: "unanswered" };
  const acc = k.accept.map(gNorm);
  if (acc.includes(g) || acc.includes(g.replace(/\s+/g, ""))) return { ok: true };
  if (g.split(" ").filter(Boolean).length > (k.limit || 1)) return { ok: false, trap: "word_limit" };
  const dk = k.distract ? Object.fromEntries(Object.entries(k.distract).map(([a, b]) => [gNorm(a), b])) : {};
  if (dk[g]) return { ok: false, trap: dk[g] };
  if (acc.some(a => a + "s" === g || a === g + "s" || a + "es" === g || a === g + "es")) return { ok: false, trap: "plural" };
  if (acc.some(a => !/^\d/.test(a) && gLev(a, g) <= (a.length >= 5 ? 2 : 1))) return { ok: false, trap: "spelling" };
  return { ok: false, trap: k.def || "paraphrase_miss" };
}
// keyItems: { id: {type, n, ns, answer|accept, ...} }, answers: { id: string | string[] }
function markAll(module, keyItems, answers) {
  const items = [];
  for (const [id, k] of Object.entries(keyItems)) {
    const info = { why: k.why, evidence: k.evidence, para: k.para || null };
    if (k.type === "multi") {
      const picked = Array.isArray(answers[id]) ? answers[id].slice(0, k.ns.length) : [];
      const right = k.answer.slice(); const wrong = picked.filter(x => !right.includes(x));
      let hits = picked.filter(x => right.includes(x));
      k.ns.forEach((n, i) => {
        const ok = i < hits.length;
        const missTrap = wrong[i - hits.length] ? ((k.traps || {})[wrong[i - hits.length]] || k.def || "lost_track") : "unanswered";
        items.push({ q: id, n, given: picked[i] || "", correct: right.join(" + "), ok, trap: ok ? null : missTrap, ...info });
      });
      continue;
    }
    const given = typeof answers[id] === "string" ? answers[id] : "";
    let r;
    if (k.type === "gap") r = markGap(k, given);
    else if (!given) r = { ok: false, trap: "unanswered" };
    else if (given === k.answer) r = { ok: true };
    else r = { ok: false, trap: (k.traps || {})[given] || k.def || "paraphrase_miss" };
    items.push({ q: id, n: k.n, given, correct: k.type === "gap" ? k.accept[0] : k.answer, ok: r.ok, trap: r.trap || null, ...info });
  }
  items.sort((a, b) => a.n - b.n);
  const raw = items.filter(i => i.ok).length;
  return { raw, total: items.length, band: bandFrom(module, raw, items.length), items };
}

async function ftBegin(slug, module) {
  let data; try { data = await ftLoad(slug); } catch (e) { toast("Couldn’t load that test. Check your connection and try again."); return; }
  if (data.locked) { actions["ft-locked"]({ dataset: { slug } }); return; }
  clearTimers();
  const mode = S.profile.mode === "practice" ? "practice" : "exam";
  const parts = data.listening.parts;
  const total = module === "reading" ? (data.reading.minutes || 60) * 60 : Math.ceil(parts.reduce((s, p) => s + (p.dur || 300), 0) + 4 * (parts.length - 1)) + 120;
  const firstId = module === "reading" ? data.reading.passages[0].groups[0].qs[0].id : parts[0].groups[0].qs[0].id;
  S.test = { full: true, slug, data, title: data.title, module, mode, answers: {}, flags: new Set(), started: Date.now(), total, remaining: total, deadline: null,
    phase: module === "listening" ? "ready" : "running", partIdx: 0, passIdx: 0, leftCount: 0, pane: "passage", cur: firstId };
  T.track("test_start", { module, mode, test: slug });
  if (mode === "exam") { try { const r = document.documentElement.requestFullscreen?.(); r && r.catch && r.catch(() => {}); } catch (e) {} }
  location.hash = "#full";
}

function ftRenderPlayer() { const b = $("#playerBox"); if (b) b.innerHTML = ftPlayerHTML(); const s = $("#exStrip"); if (s) s.innerHTML = ftStrip(); }
function ftPlayPart(i) {
  const t = S.test; if (!t) return;
  const parts = t.data.listening.parts, part = parts[i];
  stopAllAudio();
  t.partIdx = i; t.phase = "playing"; render();
  T.track("part_start", { module: "listening", part: i + 1, test: t.slug, mode: t.mode });
  const srcs = [AUDIO_CDN + part.audio, "audio/" + part.audio];
  const a = new Audio(); a.preload = "auto"; S.audio = a; let cur = -1;
  const trySrc = n => { cur = n; a.src = srcs[n]; const r = a.play(); r && r.catch && r.catch(e => { if (e && e.name === "NotAllowedError") toast("Tap Play again to start the audio."); }); };
  const fail = () => { if (S.audio !== a) return;
    if (cur + 1 < srcs.length) { T.track("audio_source_fallback", { part: i + 1, test: t.slug }); trySrc(cur + 1); return; }
    T.track("audio_fallback", { reason: "mp3_error", part: i + 1, test: t.slug }); toast("Audio couldn’t load. Check your connection.");
  };
  a.addEventListener("timeupdate", () => {
    if (S.audio !== a) return; const ct = a.currentTime, dur = part.dur || a.duration || 1;
    const bar = $("#pBar"), tm = $("#pTime"), sp = $("#pSpeaker");
    if (bar) bar.style.width = Math.min(100, ct / dur * 100) + "%";
    if (tm) tm.textContent = `${fmtTime(ct)} / ${fmtTime(dur)}`;
    const m = (part.marks || []).find(x => ct >= x.t - 0.2 && ct <= x.e + 0.5);
    if (sp) sp.textContent = m ? `${part.speakers[m.s] || "Speaker"} speaking` : "Read the questions";
  });
  a.addEventListener("ended", () => { if (S.audio === a) ftPartEnded(i); });
  a.addEventListener("error", fail);
  trySrc(0);
}
function ftPartEnded(i) {
  const t = S.test; if (!t || t.phase === "check") return; const parts = t.data.listening.parts;
  T.track("part_end", { module: "listening", part: i + 1, test: t.slug, answered: Object.keys(t.answers).length });
  if (i < parts.length - 1) {
    if (t.mode === "practice") { t.phase = "break"; pauseClock(); T.track("break_start", { after: i + 1, test: t.slug }); ftRenderPlayer(); }
    else { t.phase = "gap"; ftRenderPlayer(); setTimeout(() => { if (S.test === t) ftPlayPart(i + 1); }, 4000); }
  } else { t.phase = "check"; pauseClock(); t.remaining = Math.min(t.remaining, 120); startClock(); render(); T.track("audio_complete", { module: "listening", test: t.slug }); }
}

function ftQMeta() {
  const meta = {};
  ftUnits().forEach((u, ui) => u.groups.forEach(g => {
    const lineFor = n => { const src = g.lines ? g.lines.filter(l => typeof l === "string") : g.text ? [g.text] : g.steps ? g.steps : g.table ? g.table.rows.flat() : [];
      const l = src.find(s => s.includes(`{{${n}}}`)); return l ? l.replace(/\{\{(\d+)\}\}/g, (_, x) => x === String(n) ? "____" : "…") : ""; };
    g.qs.forEach(q => { meta[q.id] = { n: q.n, ns: qNums(q), type: q.type, part: ui + 1, text: q.text || [q.label, q.pre, "____", q.post].filter(Boolean).join(" ") || lineFor(q.n),
      options: q.options || g.box || null }; if (["notes", "summary", "table", "flow"].includes(g.kind)) meta[q.id].text = lineFor(q.n); });
  }));
  return meta;
}
async function ftFinish(auto) {

  let res = null;
  try {
    const r = await fetch(CFG.url + "/functions/v1/grade", { method: "POST", headers: { apikey: CFG.key, Authorization: "Bearer " + CFG.key, "Content-Type": "application/json" },
      body: JSON.stringify({ anon: T.anon, slug: t.slug, module: t.module, answers, mode: t.mode, left: t.leftCount, duration: dur }) });
    if (r.ok) res = await r.json();

  if (!res && LOCAL && LOCAL.keys && LOCAL.keys[t.slug]) {
    const key = LOCAL.keys[t.slug]; const tag = `${t.slug}-${t.module[0]}`;
    res = markAll(t.module, Object.fromEntries(Object.entries(key.items).filter(([id]) => id.startsWith(tag) && /^\d+$/.test(id.slice(tag.length)))), answers);

  const a = { id: res.attempt_id || uuid(), module: t.module, raw: res.raw, total: res.total, band: res.band, duration: dur, at: new Date().toISOString(), items: res.items,
    test: t.slug, title: t.title, mode: t.mode, leftCount: t.leftCount, qmeta: ftQMeta(), transcripts: res.transcripts || null,

  S.test = null;

}

  const p = $("#passage"); if (!p) return; const sel = window.getSelection(); if (!sel || sel.isCollapsed) return;
  const r = sel.getRangeAt(0); if (!p.contains(r.commonAncestorContainer)) return;
  try { const m = document.createElement("mark"); m.className = "user-hl"; r.surroundContents(m); sel.removeAllRanges(); T.track("highlight", {}); } catch (e) {}
});

/* Scroll depth + sticky CTA on landing */
let scrollTick = false;
window.addEventListener("scroll", () => {
  if (scrollTick) return; scrollTick = true;
  requestAnimationFrame(() => {
    scrollTick = false;
    if (S.route !== "home") return;
    const h = document.documentElement.scrollHeight - innerHeight; const pct = h > 0 ? scrollY / h * 100 : 100;
    [25, 50, 75, 100].forEach(m => { if (pct >= m - 1 && !S.scrollMarks[m]) { S.scrollMarks[m] = true; T.track("scroll_depth", { pct: m }); } });
    $("#stickyCta").classList.toggle("show", scrollY > 560);
  });
}, { passive: true });

/* Exit intent (desktop, landing, once per session) */
let exitShown = false;
document.addEventListener("mouseout", e => {
  if (exitShown || S.route !== "home" || e.relatedTarget || e.clientY > 0 || innerWidth < 900) return;
  exitShown = true; T.track("exit_intent_show", {});
  const d = document.createElement("div"); d.className = "slidein";
  d.innerHTML = `<b style="font-family:var(--f-display);font-size:19px">Before you go: one question.</b><p class="muted" style="font-size:14.5px">Most people get our sample question wrong. It takes 20 seconds.</p><div class="row-actions"><a href="#home" class="btn btn-primary" data-track="exit_intent_try" id="exitTry">Try it</a><button class="btn btn-quiet" data-track="exit_intent_close" id="exitClose">No thanks</button></div>`;
  document.body.appendChild(d);
  $("#exitTry", d).addEventListener("click", ev => { ev.preventDefault(); d.remove(); $("#demo")?.scrollIntoView({ behavior: "smooth", block: "center" }); });
  $("#exitClose", d).addEventListener("click", () => d.remove());
});

/* Leaving the site */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    T.track("tab_hidden", { page: S.route, seconds: Math.round((Date.now() - S.routeStart) / 1000), in_test: !!S.test, answered: S.test ? Object.keys(S.test.answers).length : null });
  } else T.track("tab_return", { page: S.route });
});
window.addEventListener("beforeunload", e => { if (S.test && !S.test.done) { T.track("test_exit_page", { module: S.test.module, answered: Object.keys(S.test.answers).length }); e.preventDefault(); e.returnValue = ""; } });

/* Boot */
T.flush().finally(() => {});
T.track("session_start", { source: SRC.source, utm: SRC.utm, returning: S.attempts.length > 0, width: innerWidth, lang: navigator.language });
route();
</script>
